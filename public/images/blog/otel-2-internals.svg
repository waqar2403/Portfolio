<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="otelc standing between go build and the compiler">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7e5e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#fafaf9"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <rect x="100" y="120" width="600" height="260" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>

  <text x="132" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#78716c">$ go build -toolexec=otelc</text>

  <rect x="132" y="200" width="140" height="64" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="202" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c1917">go build</text>
  <text x="202" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a8a29e">the manager</text>

  <rect x="330" y="192" width="140" height="80" rx="8" fill="#1c1917"/>
  <text x="400" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fafaf9">otelc</text>
  <text x="400" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#d6d3d1">in the doorway</text>

  <rect x="528" y="200" width="140" height="64" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="598" y="230" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c1917">compile</text>
  <text x="598" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a8a29e">edited files</text>

  <path d="M272 232 H322" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <path d="M322 227 l9 5 l-9 5 z" fill="#a8a29e"/>
  <path d="M470 232 H520" stroke="#a8a29e" stroke-width="1.5" fill="none"/>
  <path d="M520 227 l9 5 l-9 5 z" fill="#a8a29e"/>

  <text x="132" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#78716c">the compiler never knows it was handed</text>
  <text x="132" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#78716c">different files</text>

  <text x="100" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1c1917">Inside OpenTelemetry Go</text>
</svg>
