<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="a rule file and a hook file side by side">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7e5e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#fafaf9"/>
  <rect width="800" height="500" fill="url(#grid3)"/>

  <rect x="100" y="120" width="600" height="260" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>

  <text x="132" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a8a29e">otelc.yaml</text>
  <rect x="132" y="170" width="252" height="92" rx="8" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="148" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#78716c">where:</text>
  <text x="148" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#1c1917">  func: NewClient</text>
  <text x="148" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#78716c">do:</text>
  <text x="148" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#a8a29e">  inject_hooks</text>

  <text x="416" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a8a29e">hook.go</text>
  <rect x="416" y="170" width="252" height="92" rx="8" fill="#1c1917"/>
  <text x="432" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#d6d3d1">client.AddHook(</text>
  <text x="432" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#fafaf9">  newOtelRedisHook(...)</text>
  <text x="432" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#d6d3d1">)</text>

  <text x="132" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#78716c">the rule says where. the hook says what.</text>
  <text x="132" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1c1917">the hard part is neither.</text>
  <text x="132" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#78716c">it is knowing where to attach at all</text>

  <text x="100" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1c1917">How to write an instrumentation</text>
</svg>
