<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="a trace showing one slow service">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7e5e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#fafaf9"/>
  <rect width="800" height="500" fill="url(#grid1)"/>

  <rect x="100" y="120" width="600" height="260" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>

  <text x="132" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#78716c">POST /checkout</text>
  <text x="668" y="164" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#a8a29e">2350 ms</text>

  <rect x="132" y="184" width="536" height="22" rx="5" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="140" y="222" width="42" height="22" rx="5" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="196" y="260" width="54" height="22" rx="5" fill="#fafaf9" stroke="#a8a29e" stroke-width="1.5"/>
  <rect x="262" y="298" width="398" height="22" rx="5" fill="#1c1917"/>

  <text x="132" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a8a29e">cart</text>
  <text x="132" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a8a29e">pricing</text>
  <text x="132" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1c1917">inventory</text>

  <text x="132" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#78716c">the shape says where the time went</text>

  <text x="100" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1c1917">What the heck is observability?</text>
</svg>
